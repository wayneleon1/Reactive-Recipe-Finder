<footer class="footer">
  <div class="footer__inner container">
    <p class="footer__credit text-preset-10">Made with ❤️ and 🥑</p>

    <ul class="footer__social" role="list" aria-label="Social media links">
      @for (link of socialLinks; track link.label) {
        <li>
          <a
            [href]="link.href"
            class="footer__social-link"
            [attr.aria-label]="link.label"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img [src]="link.icon" [alt]="link.label" width="20" height="20" />
          </a>
        </li>
      }
    </ul>
  </div>
</footer>
