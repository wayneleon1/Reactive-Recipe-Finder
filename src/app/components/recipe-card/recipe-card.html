<article class="recipe-card">
  <!-- Recipe image -->
  <div class="recipe-card__image-wrapper">
    <img
      class="recipe-card__image"
      [src]="recipe().image.large"
      [srcset]="recipe().image.small + ' 400w, ' + recipe().image.large + ' 800w'"
      sizes="(max-width: 640px) 100vw, 400px"
      [alt]="recipe().title"
      loading="lazy"
      width="800"
      height="480"
    />
  </div>

  <!-- Card body -->
  <div class="recipe-card__body">
    <!-- Title -->
    <h3 class="recipe-card__title text-preset-4">
      {{ recipe().title }}
    </h3>

    <!-- Overview -->
    <p class="recipe-card__overview text-preset-9">
      {{ recipe().overview }}
    </p>

    <!-- Meta info -->
    <div class="recipe-card__meta">
      <span class="recipe-card__meta-item">
        <img src="assets/images/icon-servings.svg" alt="Servings" width="16" height="16" />
        <span class="text-preset-10">Servings: {{ recipe().servings }}</span>
      </span>

      <span class="recipe-card__meta-item">
        <img src="assets/images/icon-prep-time.svg" alt="Prep time" width="16" height="16" />
        <span class="text-preset-10">Prep: {{ recipe().prepMinutes }} mins</span>
      </span>

      <span class="recipe-card__meta-item">
        <img src="assets/images/icon-cook-time.svg" alt="Cook time" width="16" height="16" />
        <span class="text-preset-10">Cook: {{ recipe().cookMinutes }} min</span>
      </span>
    </div>

    <!-- CTA -->
    <app-button variant="primary" size="md" [fullWidth]="true" (clicked)="onViewRecipe()">
      View Recipe
    </app-button>
  </div>
</article>
