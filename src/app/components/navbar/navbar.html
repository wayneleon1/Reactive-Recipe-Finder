<header class="navbar">
  <div class="navbar__inner container">
    <!-- Logo -->
    <a href="#home" class="navbar__logo" aria-label="Healthy Recipe Finder - Go to home">
      <img src="assets/images/logo.svg" alt="" aria-hidden="true" />
    </a>

    <!-- Desktop navigation -->
    <nav class="navbar__nav" aria-label="Main navigation">
      <ul class="navbar__links" role="list">
        @for (link of navLinks; track link.label) {
          <li>
            <a
              [href]="link.href"
              class="navbar__link"
              [class.navbar__link--active]="activeLink() === link.label"
              (click)="setActive(link.label)"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Desktop CTA -->
    <div class="navbar__cta">
      <app-button variant="primary" size="md"> Browse recipes </app-button>
    </div>

    <!-- Mobile hamburger -->
    <button
      class="navbar__hamburger"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-controls="mobile-menu"
      aria-label="Toggle navigation menu"
      (click)="toggleMobileMenu()"
    >
      <img
        src="assets/images/icon-hamburger-menu.svg"
        alt=""
        width="24"
        height="24"
        aria-hidden="true"
      />
    </button>
  </div>

  <!-- Mobile menu dropdown -->
  @if (isMobileMenuOpen()) {
    <div
      id="mobile-menu"
      class="navbar__mobile-menu"
      role="dialog"
      aria-modal="false"
      aria-label="Navigation menu"
    >
      <ul class="navbar__mobile-links" role="list">
        @for (link of navLinks; track link.label) {
          <li>
            <a
              [href]="link.href"
              class="navbar__mobile-link"
              [class.navbar__mobile-link--active]="activeLink() === link.label"
              (click)="setActive(link.label)"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <div class="navbar__mobile-cta">
        <app-button variant="primary" size="md" [fullWidth]="true"> Browse recipes </app-button>
      </div>
    </div>
  }
</header>
